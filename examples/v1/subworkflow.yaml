apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: reusable-sub-workflow
spec:
  inputs:
    message: durable
  outputs:
    result: "${{ tasks.summary.output.result }}"
  policy:
    approval: never
  actions:
    assign:
      kind: builtin.assign
  subworkflows:
    summarize:
      version: 1.0.0
      inputSchema:
        type: object
        required: [message]
        additionalProperties: false
        properties:
          message:
            type: string
      outputSchema:
        type: object
        required: [result]
        additionalProperties: false
        properties:
          result:
            type: string
      outputs:
        result: "${{ tasks.finish.output.output.result }}"
      tasks:
        - id: prepare
          uses: action:assign
          with:
            value: "${{ inputs.message }}"
        - id: finish
          uses: action:assign
          needs: [prepare]
          with:
            result: "${{ tasks.prepare.output.output.value }}"
  tasks:
    - id: summary
      uses: workflow:summarize
      with:
        message: "${{ inputs.message }}"
