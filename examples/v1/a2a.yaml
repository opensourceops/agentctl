apiVersion: agentctl.dev/v1alpha1
kind: Workflow
metadata:
  name: a2a-delegation
spec:
  policy:
    networkAllowlist: [127.0.0.1]
    approval: never
  a2aPeers:
    local:
      cardUrl: http://127.0.0.1:8766/.well-known/agent-card.json
      protocolVersion: "1.0"
      timeoutSeconds: 5
      maxPolls: 100
      pollIntervalMs: 100
  actions:
    delegate:
      kind: a2a.delegate
  tasks:
    - id: delegate
      uses: action:delegate
      with:
        peer: local
        messageId: example-message-1
        message: perform the bounded fixture task
