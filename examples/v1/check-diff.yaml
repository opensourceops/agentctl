apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: check-diff
spec:
  policy:
    workspaceRoot: .
    writableRoots: [artifacts]
    approval: never
  actions:
    report:
      kind: builtin.write
  tasks:
    - id: report
      uses: action:report
      with:
        path: artifacts/report.txt
        content: deterministic preview
