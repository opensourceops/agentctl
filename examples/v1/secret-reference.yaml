apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: secret-reference
spec:
  providers:
    openai:
      kind: openai
      credential:
        env: OPENAI_API_KEY
  policy:
    networkAllowlist: [api.openai.com]
  agents:
    answer:
      provider: openai
      model: gpt-5.6
      instructions: Reply concisely.
      maxTurns: 1
      maxOutputTokens: 64
  tasks:
    - id: answer
      uses: agent:answer
      with: { prompt: hello }
