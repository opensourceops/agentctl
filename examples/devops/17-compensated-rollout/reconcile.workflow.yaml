# Host Python is trusted; the YAML exposes snapshot, mutation, probe and recovery boundaries.
apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-compensated-rollout-reconcile
  description: Fail after a local rollout, plan and execute its explicit inverse, and inspect linked reconciliation evidence.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
  runtime:
    maxConcurrency: 1
    budgets:
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
  actions:
    read:
      kind: builtin.read
    probe-service:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - service-probe
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - endpointPath
          - expectedText
          - requireHealthy
        properties:
          endpointPath:
            type: string
          expectedText:
            type: string
          requireHealthy:
            type: boolean
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - verified
          - reason
          - httpStatus
          - version
          - healthy
          - sha256
          - url
          - scope
          - reportText
        properties:
          verified:
            type: boolean
          reason:
            type: string
          httpStatus:
            type: integer
          version:
            type: string
          healthy:
            type: boolean
          sha256:
            type: string
          url:
            type: string
          scope:
            type: string
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    assert:
      kind: builtin.assert
    write:
      kind: builtin.write
  tasks:
    - id: prior
      uses: action:read
      with:
        path: artifacts/prior-service.json
    - id: probe
      uses: action:probe-service
      needs:
        - prior
      with:
        endpointPath: '${{ inputs.endpointPath }}'
        expectedText: '${{ tasks.prior.output.content }}'
        requireHealthy: true
    - id: restored
      uses: action:assert
      needs:
        - probe
      with:
        that: '${{ tasks.probe.output.verified }}'
        message: compensation did not restore the captured healthy bytes
    - id: report
      uses: action:write
      needs:
        - probe
        - restored
      with:
        path: artifacts/reconciliation.json
        content: '${{ tasks.probe.output.reportText }}'
  inputs:
    endpointPath: service-endpoint.json
  outputs:
    report: '${{ tasks.probe.output }}'
