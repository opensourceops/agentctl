apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-canary-evaluation
  description: Aggregate canary metrics and use typed routing to choose an isolated promotion or 
    rollback artifact.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
  runtime:
    maxConcurrency: 1
    budgets:
      maxProviderRequests: 8
      maxTurns: 8
      maxToolCalls: 4
      maxTotalTokens: 16000
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
  actions:
    fixture:
      kind: extension.process
      command: python3
      args:
        - ../fixture.py
        - '13'
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
      outputSchema:
        type: object
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    write:
      kind: builtin.write
    assign:
      kind: builtin.assign
    assert:
      kind: builtin.assert
  tasks:
    - id: analyze
      uses: action:fixture
      with:
        errorLimit: '${{ inputs.errorLimit }}'
      outputSchema:
        type: object
        required:
          - route
        properties:
          route:
            type: string
            enum:
              - promote
              - rollback
    - id: route
      uses: router
      needs:
        - analyze
      route:
        select: '${{ tasks.analyze.output.route }}'
        cases:
          - equals: promote
            tasks:
              - promote
        default:
          - rollback
    - id: promote
      uses: action:write
      needs:
        - route
      with:
        path: artifacts/promotion.json
        content: |
          {"scope":"local fixture","promoted":true}
    - id: rollback
      uses: action:write
      needs:
        - route
      with:
        path: artifacts/rollback.json
        content: |
          {"scope":"local fixture","rolledBack":true}
    - id: report
      uses: action:write
      needs:
        - analyze
      with:
        path: artifacts/report.json
        content: '${{ tasks.analyze.output.reportText }}'
  inputs:
    errorLimit: 0.01
  outputs:
    report: '${{ tasks.analyze.output }}'
