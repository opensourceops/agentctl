{
  "apiVersion": "agentctl.dev/v1",
  "kind": "Workflow",
  "metadata": {
    "name": "devops-bounded-remediation",
    "description": "Run a bounded model/tool remediation loop, validate the resulting local configuration, and retain token/cost/audit evidence."
  },
  "spec": {
    "policy": {
      "workspaceRoot": ".",
      "writableRoots": [
        "artifacts"
      ],
      "processAllowlist": [
        "python3"
      ],
      "approval": "never"
    },
    "runtime": {
      "maxConcurrency": 1,
      "budgets": {
        "maxProviderRequests": 6,
        "maxTurns": 6,
        "maxToolCalls": 3,
        "maxTotalTokens": 16000,
        "maxProcessOutputBytes": 1048576,
        "maxArtifactBytes": 1048576,
        "maxTasks": 32,
        "maxWallTimeSeconds": 120,
        "maxLoopIterations": 3,
        "maxCostMicrousd": 100000
      },
      "pricing": {
        "version": "fixture-synthetic-v1",
        "models": {
          "fake/scripted": {
            "inputMicrousdPerMillionTokens": 1000000,
            "outputMicrousdPerMillionTokens": 1000000
          }
        }
      }
    },
    "actions": {
      "fixture": {
        "kind": "extension.process",
        "command": "python3",
        "args": [
          "../fixture.py",
          "20"
        ],
        "idempotency": "idempotent",
        "protocolVersion": "agentctl.dev/process-extension/v1",
        "inputSchema": {
          "type": "object"
        },
        "outputSchema": {
          "type": "object"
        },
        "capabilities": [
          "devops.fixture"
        ],
        "timeoutSeconds": 30,
        "stdoutLimitBytes": 65536,
        "stderrLimitBytes": 8192,
        "combinedOutputLimitBytes": 73728
      },
      "write": {
        "kind": "builtin.write"
      },
      "assign": {
        "kind": "builtin.assign"
      },
      "assert": {
        "kind": "builtin.assert"
      },
      "read": {
        "kind": "builtin.read"
      }
    },
    "tasks": [
      {
        "id": "read-config",
        "uses": "action:read",
        "with": {
          "path": "fixtures/configuration.json"
        }
      },
      {
        "id": "remediate",
        "uses": "agent:remediator",
        "needs": [
          "read-config"
        ],
        "with": {
          "prompt": {
            "configuration": "${{ tasks.read-config.output.content }}",
            "previous": "${{ vars.loopPrevious }}",
            "iteration": "${{ vars.loopIndex }}",
            "limit": 30
          }
        },
        "loop": {
          "maxIterations": 3,
          "while": "${{ vars.loopPrevious.done == false }}",
          "initial": {
            "done": false
          }
        },
        "outputSchema": {
          "type": "object",
          "required": [
            "done",
            "timeoutSeconds"
          ],
          "additionalProperties": false,
          "properties": {
            "done": {
              "type": "boolean"
            },
            "timeoutSeconds": {
              "const": 30
            }
          }
        }
      },
      {
        "id": "analyze",
        "uses": "action:fixture",
        "needs": [
          "remediate"
        ],
        "with": {}
      },
      {
        "id": "report",
        "uses": "action:write",
        "needs": [
          "analyze"
        ],
        "with": {
          "path": "artifacts/report.json",
          "content": "${{ tasks.analyze.output.reportText }}"
        }
      }
    ],
    "providers": {
      "fake": {
        "kind": "fake"
      }
    },
    "tools": {
      "repair_config": {
        "kind": "builtin.workspace.write",
        "description": "Write the validated local timeout setting",
        "inputSchema": {
          "type": "object",
          "required": [
            "path",
            "content"
          ],
          "additionalProperties": false,
          "properties": {
            "path": {
              "type": "string",
              "enum": [
                "artifacts/remediation.json"
              ]
            },
            "content": {
              "type": "string",
              "enum": [
                "{\"timeoutSeconds\":30}\n"
              ]
            }
          }
        },
        "outputSchema": {
          "type": "object"
        },
        "capability": "filesystem.write",
        "effectClass": "workspace_mutate",
        "risk": "medium",
        "idempotency": "idempotent",
        "retrySafe": true,
        "timeoutSeconds": 5,
        "approval": "policy"
      }
    },
    "agents": {
      "remediator": {
        "provider": "fake",
        "model": "scripted",
        "instructionsFile": "instructions/remediator.md",
        "tools": [
          "repair_config"
        ],
        "maxTurns": 2,
        "maxToolCalls": 1,
        "maxOutputTokens": 512,
        "timeoutSeconds": 45,
        "structuredOutput": {
          "type": "object",
          "required": [
            "done",
            "timeoutSeconds"
          ],
          "additionalProperties": false,
          "properties": {
            "done": {
              "type": "boolean"
            },
            "timeoutSeconds": {
              "type": "integer"
            }
          }
        },
        "providerOptions": {
          "finalText": "{\"done\": true, \"timeoutSeconds\": 30}",
          "toolInput": {
            "path": "artifacts/remediation.json",
            "content": "{\"timeoutSeconds\":30}\n"
          }
        }
      }
    },
    "outputs": {
      "report": "${{ tasks.analyze.output }}"
    }
  }
}
