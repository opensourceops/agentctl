# Repair completion uses actual artifact validation; optional model done only ends proposal attempts.
apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-bounded-remediation
  description: Run a bounded model/tool remediation loop, validate the resulting local configuration, and retain token/cost/audit evidence.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
  runtime:
    maxConcurrency: 1
    budgets:
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
      maxLoopIterations: 6
  actions:
    prepare:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - prepare-remediation
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        required:
          - configurationPath
          - maxTimeout
          - maxReduction
        additionalProperties: false
        properties:
          configurationPath:
            type: string
          maxTimeout:
            type: integer
          maxReduction:
            type: integer
      outputSchema:
        type: object
        required:
          - configurationPath
          - configuration
          - sourceSha256
          - current
          - expectedTimeout
          - maxTimeout
          - maxReduction
          - iteration
          - targetTimeout
          - reportText
        additionalProperties: false
        properties:
          configurationPath:
            type: string
          configuration:
            type: object
          sourceSha256:
            type: string
          current:
            type: object
          expectedTimeout:
            type: integer
          maxTimeout:
            type: integer
          maxReduction:
            type: integer
          iteration:
            type: integer
          targetTimeout:
            type: integer
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    repair-step:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - remediation-step
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        required:
          - configurationPath
          - maxTimeout
          - maxReduction
          - iteration
          - previous
        additionalProperties: false
        properties:
          configurationPath:
            type: string
          maxTimeout:
            type: integer
          maxReduction:
            type: integer
          iteration:
            type: integer
          previous:
            type: object
      outputSchema:
        type: object
        required:
          - done
          - timeoutSeconds
          - iteration
          - artifactSha256
          - reportText
        additionalProperties: false
        properties:
          done:
            type: boolean
          timeoutSeconds:
            type: integer
          iteration:
            type: integer
          artifactSha256:
            type: string
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    verify:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - verify-remediation
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        required:
          - configurationPath
          - maxTimeout
        additionalProperties: false
        properties:
          configurationPath:
            type: string
          maxTimeout:
            type: integer
      outputSchema:
        type: object
        required:
          - validated
          - configuration
          - maxTimeout
          - artifactSha256
          - completionEvidence
          - reportText
        additionalProperties: false
        properties:
          validated:
            type: boolean
          configuration:
            type: object
          maxTimeout:
            type: integer
          artifactSha256:
            type: string
          completionEvidence:
            type: string
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    write:
      kind: builtin.write
  tasks:
    - id: prepare
      uses: action:prepare
      with:
        configurationPath: '${{ inputs.configurationPath }}'
        maxTimeout: '${{ inputs.maxTimeout }}'
        maxReduction: '${{ inputs.maxReduction }}'
    - id: repair
      uses: action:repair-step
      needs:
        - prepare
      with:
        configurationPath: '${{ inputs.configurationPath }}'
        maxTimeout: '${{ inputs.maxTimeout }}'
        maxReduction: '${{ inputs.maxReduction }}'
        iteration: '${{ vars.loopIndex }}'
        previous: '${{ vars.loopPrevious }}'
      loop:
        maxIterations: 3
        while: '${{ vars.loopPrevious.done == false }}'
        initial:
          done: false
    - id: analyze
      uses: action:verify
      needs:
        - repair
      with:
        configurationPath: '${{ inputs.configurationPath }}'
        maxTimeout: '${{ inputs.maxTimeout }}'
    - id: report
      uses: action:write
      needs:
        - analyze
      with:
        path: artifacts/report.json
        content: '${{ tasks.analyze.output.reportText }}'
  inputs:
    configurationPath: fixtures/configuration.json
    maxTimeout: 30
    maxReduction: 120
  outputs:
    report: '${{ tasks.analyze.output }}'
