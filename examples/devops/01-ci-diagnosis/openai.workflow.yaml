apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-ci-diagnosis-openai
  description: Parse a failed build log, classify its root cause, and verify model citations against exact log lines.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
    networkAllowlist:
      - api.openai.com
  runtime:
    maxConcurrency: 1
    budgets:
      maxProviderRequests: 1
      maxTurns: 8
      maxToolCalls: 4
      maxTotalTokens: 16000
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
      maxCostMicrousd: 100000
    pricing:
      version: openai-public-2026-09-05-estimate
      models:
        openai/gpt-5-mini:
          inputMicrousdPerMillionTokens: 250000
          outputMicrousdPerMillionTokens: 2000000
  actions:
    diagnose-ci:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - ci-diagnose
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - logPath
        properties:
          logPath:
            type: string
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - findings
          - rootCause
          - evidence
          - lineCount
          - supportedActions
          - suggestedDecision
          - validationScope
          - reportText
        properties:
          findings:
            type: array
          rootCause:
            type: string
          evidence:
            type: array
          lineCount:
            type: integer
          supportedActions:
            type: object
          suggestedDecision:
            type: object
          validationScope:
            type: string
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    verify-decision:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - verify-ci-decision
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - report
          - analysis
        properties:
          report:
            type: object
          analysis:
            type: object
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - report
          - analysis
          - semanticValidation
          - validationScope
          - advisory
          - reportText
        properties:
          report:
            type: object
          analysis:
            type: object
          semanticValidation:
            type: boolean
          validationScope:
            type: string
          advisory:
            type: object
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    write:
      kind: builtin.write
  tasks:
    - id: analyze
      uses: action:diagnose-ci
      with:
        logPath: '${{ inputs.logPath }}'
    - id: advise
      uses: agent:analyst
      needs:
        - analyze
      with:
        prompt: '${{ tasks.analyze.output }}'
    - id: verify
      uses: action:verify-decision
      needs:
        - analyze
        - advise
      with:
        report: '${{ tasks.analyze.output }}'
        analysis: '${{ tasks.advise.output }}'
    - id: report
      uses: action:write
      needs:
        - verify
      with:
        path: artifacts/report.json
        content: '${{ tasks.verify.output.reportText }}'
  inputs:
    logPath: fixtures/build.log
  providers:
    openai:
      kind: openai
      credential:
        env: OPENAI_API_KEY
  agents:
    analyst:
      provider: openai
      model: gpt-5-mini
      instructionsFile: instructions/analyst.md
      tools: []
      maxTurns: 1
      maxToolCalls: 0
      maxOutputTokens: 1024
      timeoutSeconds: 45
      structuredOutput:
        type: object
        required:
          - rootCause
          - evidence
          - action
        additionalProperties: false
        properties:
          rootCause:
            type: string
            enum:
              - missing_dependency
              - test_failure
              - configuration_error
              - unknown
            description: Machine-readable classification code from the deterministic parsed report.
          evidence:
            type: array
            items:
              type: string
            minItems: 1
          action:
            type: string
            enum:
              - install_declared_dependency
              - inspect_test_failure
              - repair_configuration
              - investigate_build
      providerOptions:
        store: false
      reasoning:
        effort: low
  outputs:
    report: '${{ tasks.verify.output }}'
