{
  "apiVersion": "agentctl.dev/v1",
  "kind": "Workflow",
  "metadata": {
    "name": "devops-terraform-plan",
    "description": "Reject destructive or nonlocal plan changes and require recorded approval before writing isolated local state."
  },
  "spec": {
    "policy": {
      "workspaceRoot": ".",
      "writableRoots": [
        "artifacts"
      ],
      "processAllowlist": [
        "python3"
      ],
      "approval": "mutations"
    },
    "runtime": {
      "maxConcurrency": 1,
      "budgets": {
        "maxProviderRequests": 8,
        "maxTurns": 8,
        "maxToolCalls": 4,
        "maxTotalTokens": 16000,
        "maxProcessOutputBytes": 1048576,
        "maxArtifactBytes": 1048576,
        "maxTasks": 32,
        "maxWallTimeSeconds": 120
      }
    },
    "actions": {
      "fixture": {
        "kind": "extension.process",
        "command": "python3",
        "args": [
          "../fixture.py",
          "06"
        ],
        "idempotency": "idempotent",
        "protocolVersion": "agentctl.dev/process-extension/v1",
        "inputSchema": {
          "type": "object"
        },
        "outputSchema": {
          "type": "object"
        },
        "capabilities": [
          "devops.fixture"
        ],
        "timeoutSeconds": 30,
        "stdoutLimitBytes": 65536,
        "stderrLimitBytes": 8192,
        "combinedOutputLimitBytes": 73728
      },
      "write": {
        "kind": "builtin.write"
      },
      "assign": {
        "kind": "builtin.assign"
      },
      "assert": {
        "kind": "builtin.assert"
      }
    },
    "tasks": [
      {
        "id": "analyze",
        "uses": "action:fixture",
        "with": {}
      },
      {
        "id": "allow-plan",
        "uses": "action:assert",
        "needs": [
          "analyze"
        ],
        "with": {
          "that": "${{ tasks.analyze.output.allowed }}",
          "message": "plan contains destructive or nonlocal changes"
        }
      },
      {
        "id": "apply-local",
        "uses": "action:write",
        "needs": [
          "allow-plan"
        ],
        "with": {
          "path": "artifacts/local-state.json",
          "content": "{\"scope\":\"local fixture\",\"applied\":true}\n"
        }
      },
      {
        "id": "report",
        "uses": "action:write",
        "needs": [
          "analyze"
        ],
        "with": {
          "path": "artifacts/report.json",
          "content": "${{ tasks.analyze.output.reportText }}"
        }
      }
    ],
    "outputs": {
      "report": "${{ tasks.analyze.output }}"
    }
  }
}
