apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: responses-tool-preflight
  description: Echo both exact multiline tool inputs before the full live journey.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - state
    networkAllowlist:
      - api.openai.com
    approval: never
  providers:
    openai:
      kind: openai
      credential:
        env: OPENAI_API_KEY
  runtime:
    maxConcurrency: 1
    budgets:
      maxProviderRequests: 3
      maxTurns: 3
      maxToolCalls: 1
      maxTotalTokens: 8000
      maxWallTimeSeconds: 120
      maxCostMicrousd: 200000
    pricing:
      version: openai-public-2026-09-08-estimate
      models:
        openai/gpt-6-astra:
          inputMicrousdPerMillionTokens: 10000000
          outputMicrousdPerMillionTokens: 50000000
          cacheReadMicrousdPerMillionTokens: 1000000
          cacheWriteMicrousdPerMillionTokens: 12500000
  tools:
    echo:
      kind: builtin.echo
      description: Echo the exact reviewed manifest and lock inputs without writing files
      inputSchema: &id001
        type: object
        additionalProperties: false
        required:
          - manifest
          - lock
        properties:
          manifest:
            type: object
            additionalProperties: false
            required:
              - path
              - content
            properties:
              path:
                type: string
                enum:
                  - patch/requirements.in
              content:
                type: string
                pattern: |-
                  ^# Deliberately vulnerable sample dependency; never install into the tooling environment\.\nurllib3==2\.7\.0\n$
          lock:
            type: object
            additionalProperties: false
            required:
              - path
              - content
            properties:
              path:
                type: string
                enum:
                  - patch/requirements.lock
              content:
                type: string
                pattern: |-
                  ^# Hash-locked pure Python wheel; application dependencies only\.\nurllib3==2\.7\.0 --hash=sha256:9fb4c81ebbb1ce9531cce37674bbc6f1360472bc18ca9a553ede278ef7276897\n$
      outputSchema: *id001
      capability: internal
      effectClass: pure
      risk: low
      idempotency: pure
      retrySafe: true
      timeoutSeconds: 5
      approval: policy
  agents:
    probe:
      provider: openai
      model: gpt-6-astra
      reasoning:
        effort: high
      instructionsFile: instructions/preflight.md
      tools:
        - echo
      maxTurns: 3
      maxToolCalls: 1
      maxOutputTokens: 512
      timeoutSeconds: 90
      structuredOutput:
        type: object
        additionalProperties: false
        required:
          - echo
        properties:
          echo:
            type: string
            enum:
              - ok
      providerOptions:
        store: false
  actions:
    verify:
      kind: builtin.assert
  tasks:
    - id: probe
      uses: agent:probe
      with:
        prompt:
          manifest:
            path: patch/requirements.in
            content: "# Deliberately vulnerable sample dependency; never install into the tooling environment.\nurllib3==2.7.0\n"
          lock:
            path: patch/requirements.lock
            content: "# Hash-locked pure Python wheel; application dependencies only.\nurllib3==2.7.0 --hash=sha256:9fb4c81ebbb1ce9531cce37674bbc6f1360472bc18ca9a553ede278ef7276897\n"
    - id: verify
      uses: action:verify
      needs:
        - probe
      with:
        that: ${{ tasks.probe.output.echo == "ok" }}
        message: Preflight structured echo differs
  outputs:
    preflight: ${{ tasks.probe.output }}
