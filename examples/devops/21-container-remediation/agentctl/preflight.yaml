apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: responses-tool-preflight
  description: One scoped echo and strict output before the full live journey.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - state
    networkAllowlist:
      - api.openai.com
    approval: never
  providers:
    openai:
      kind: openai
      credential:
        env: OPENAI_API_KEY
  runtime:
    maxConcurrency: 1
    budgets:
      maxProviderRequests: 3
      maxTurns: 3
      maxToolCalls: 1
      maxTotalTokens: 8000
      maxWallTimeSeconds: 120
      maxCostMicrousd: 200000
    pricing:
      version: openai-public-2026-09-06-estimate
      models:
        openai/gpt-6-astra:
          inputMicrousdPerMillionTokens: 10000000
          outputMicrousdPerMillionTokens: 50000000
  tools:
    echo:
      kind: builtin.echo
      description: Echo ok
      inputSchema: &id001
        type: object
        additionalProperties: false
        required:
          - text
        properties:
          text:
            type: string
            enum:
              - ok
      outputSchema: *id001
      capability: internal
      effectClass: pure
      risk: low
      idempotency: pure
      retrySafe: true
      timeoutSeconds: 5
      approval: policy
  agents:
    probe:
      provider: openai
      model: gpt-6-astra
      reasoning:
        effort: high
      instructionsFile: instructions/preflight.md
      tools:
        - echo
      maxTurns: 3
      maxToolCalls: 1
      maxOutputTokens: 512
      timeoutSeconds: 90
      structuredOutput:
        type: object
        additionalProperties: false
        required:
          - echo
        properties:
          echo:
            type: string
            enum:
              - ok
      providerOptions:
        store: false
  actions:
    verify:
      kind: builtin.assert
  tasks:
    - id: probe
      uses: agent:probe
      with:
        prompt: Run the echo preflight.
    - id: verify
      uses: action:verify
      needs:
        - probe
      with:
        that: ${{ tasks.probe.output.echo == "ok" }}
        message: Preflight structured echo differs
  outputs:
    preflight: ${{ tasks.probe.output }}
