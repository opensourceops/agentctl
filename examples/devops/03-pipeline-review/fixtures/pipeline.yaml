name: fixture-ci
on:
  push:
    branches:
      - main
  pull_request: {}
permissions: write-all
concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: '1'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest
