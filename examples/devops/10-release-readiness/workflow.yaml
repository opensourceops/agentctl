apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-release-readiness
  description: Combine deterministic gate results and package digest evidence into an explicit go/no-go decision.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
  runtime:
    maxConcurrency: 1
    budgets:
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
  actions:
    assess-release:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - release-readiness
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - gatesPath
          - packagePath
        properties:
          gatesPath:
            type: string
          packagePath:
            type: string
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - checks
          - decision
          - blocking
          - mode
          - requiresExplicitCiGate
          - reportText
        properties:
          checks:
            type: array
          decision:
            type: string
          blocking:
            type: array
          mode:
            type: string
          requiresExplicitCiGate:
            type: boolean
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    write:
      kind: builtin.write
  tasks:
    - id: analyze
      uses: action:assess-release
      with:
        gatesPath: '${{ inputs.gatesPath }}'
        packagePath: '${{ inputs.packagePath }}'
    - id: report
      uses: action:write
      needs:
        - analyze
      with:
        path: artifacts/report.json
        content: '${{ tasks.analyze.output.reportText }}'
  inputs:
    gatesPath: fixtures/gates.json
    packagePath: fixtures/package.txt
  outputs:
    report: '${{ tasks.analyze.output }}'
