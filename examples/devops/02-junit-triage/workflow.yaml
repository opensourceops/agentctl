apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-junit-triage
  description: Parse JUnit issues and preserve failures, application errors, skips and unknown causes; infer infrastructure only from evidence.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
  runtime:
    maxConcurrency: 1
    budgets:
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
  actions:
    parse-junit:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - junit-triage
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - reportPath
        properties:
          reportPath:
            type: string
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - tests
          - testCases
          - failures
          - failedCount
          - issueCount
          - skippedCount
          - status
          - reportText
        properties:
          tests:
            type: integer
          testCases:
            type: array
          failures:
            type: array
          failedCount:
            type: integer
          issueCount:
            type: integer
          skippedCount:
            type: integer
          status:
            type: string
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    write:
      kind: builtin.write
  tasks:
    - id: analyze
      uses: action:parse-junit
      with:
        reportPath: '${{ inputs.reportPath }}'
    - id: report
      uses: action:write
      needs:
        - analyze
      with:
        path: artifacts/report.json
        content: '${{ tasks.analyze.output.reportText }}'
  inputs:
    reportPath: fixtures/junit.xml
  outputs:
    report: '${{ tasks.analyze.output }}'
