apiVersion: agentctl.dev/v1
kind: Workflow
metadata:
  name: devops-kubernetes-review
  description: Repair fixture replica typing and non-root security settings; validate known fields against a pinned full Deployment schema without a cluster.
spec:
  policy:
    workspaceRoot: .
    writableRoots:
      - artifacts
    processAllowlist:
      - python3
    approval: never
  runtime:
    maxConcurrency: 1
    budgets:
      maxProcessOutputBytes: 1048576
      maxArtifactBytes: 1048576
      maxTasks: 32
      maxWallTimeSeconds: 120
  actions:
    propose-deployment:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - kubernetes-propose
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - sourcePath
        properties:
          sourcePath:
            type: string
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - proposalPath
          - patchPath
          - sourceSha256
          - proposedSha256
          - violations
          - reportText
        properties:
          proposalPath:
            type: string
          patchPath:
            type: string
          sourceSha256:
            type: string
          proposedSha256:
            type: string
          violations:
            type: array
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    validate-deployment:
      kind: extension.process
      command: python3
      args:
        - helper.py
        - kubernetes-validate
      idempotency: idempotent
      protocolVersion: agentctl.dev/process-extension/v1
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - sourcePath
          - proposalPath
          - schemaPath
        properties:
          sourcePath:
            type: string
          proposalPath:
            type: string
          schemaPath:
            type: string
      outputSchema:
        type: object
        additionalProperties: false
        required:
          - manifest
          - violations
          - schemaScope
          - schemaSha256
          - validated
          - reportText
        properties:
          manifest:
            type: object
          violations:
            type: array
          schemaScope:
            type: string
          schemaSha256:
            type: string
          validated:
            type: boolean
          reportText:
            type: string
      capabilities:
        - devops.fixture
      timeoutSeconds: 30
      stdoutLimitBytes: 65536
      stderrLimitBytes: 8192
      combinedOutputLimitBytes: 73728
    write:
      kind: builtin.write
  tasks:
    - id: propose
      uses: action:propose-deployment
      with:
        sourcePath: '${{ inputs.sourcePath }}'
    - id: analyze
      uses: action:validate-deployment
      needs:
        - propose
      with:
        sourcePath: '${{ inputs.sourcePath }}'
        proposalPath: '${{ tasks.propose.output.proposalPath }}'
        schemaPath: '${{ inputs.schemaPath }}'
    - id: report
      uses: action:write
      needs:
        - analyze
      with:
        path: artifacts/report.json
        content: '${{ tasks.analyze.output.reportText }}'
  inputs:
    sourcePath: fixtures/deployment.yaml
    schemaPath: fixtures/deployment-v1.35.0.schema.json
  outputs:
    report: '${{ tasks.analyze.output }}'
