name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, "1.88.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo xtask verify

  acceptance:
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask acceptance

  container:
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask acceptance-container
      - name: Reject fixed critical/high image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentctl-acceptance:local
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentctl-acceptance:local
          format: cyclonedx
          output: agentctl-image.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: agentctl-image-sbom
          path: agentctl-image.cdx.json
          if-no-files-found: error

  supply-chain:
    env:
      RUSTUP_TOOLCHAIN: stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
      - run: cargo xtask verify
