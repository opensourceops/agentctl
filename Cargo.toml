[workspace]
members = [
  "crates/agentctl-core",
  "crates/agentctl-store",
  "crates/agentctl-runtime",
  "crates/agentctl-providers",
  "crates/agentctl-protocols",
  "crates/agentctl-observability",
  "crates/agentctl-cli",
  "xtask",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ompragash/agentctl"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
bytes = "1.11.0"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.53", features = ["derive", "env", "string"] }
clap_complete = "4.5.61"
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.4.0"
jsonschema = { version = "0.37.1", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
opentelemetry = "0.31.0"
parking_lot = "0.12.5"
proptest = "1.9.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
schemars = { version = "1.2.1", features = ["preserve_order"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "signal", "time", "fs", "io-util", "sync"] }
tokio-util = "0.7.17"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
